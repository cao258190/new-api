name: Code security

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Source analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Initialize source security analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/vendor/**'
              - web/dist/**

      - name: Build Go modules for source extraction
        if: matrix.language == 'go'
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go build ./...
          (cd relaykit && go build ./...)
          (cd tokenkit && go build ./...)

      - name: Analyze source and upload code findings
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: source-security/${{ matrix.language }}
          output: codeql-results
          upload-database: false

      # This gate reads only CodeQL findings in tracked source files. Package
      # CVE reports from Trivy or other dependency scanners are advisory.
      - name: Enforce high and critical source security findings
        run: python3 .github/scripts/check-code-security.py codeql-results

      - name: Keep source analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: code-security-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: ignore
          retention-days: 30

  gate:
    name: Source code security
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require completed source analyses
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYSIS_RESULT" = success
