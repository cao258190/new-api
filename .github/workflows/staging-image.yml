name: Staging image artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-image-us-4-8
  cancel-in-progress: false

# Build only the reviewed source for the existing isolated test environment.
# Reuse local frontend and accounting checks; verify affected Go paths on Linux.
# Production publishing remains a separate, protected registry workflow.
env:
  SOURCE_SHA: 5fb53113e00e9c219b798aa9382fb0df3aa36e36
  UPSTREAM_SHA: c9c6da2786b6a0912215127e78e28fbc6650c85f
  RELEASE_VERSION: custom-v2026.11.19.4-rc.1
  IMAGE_REF: new-api-staging:custom-v2026.11.19.4-rc.1

jobs:
  verify:
    name: Verify response usage regression
    if: github.repository == 'cao258190/new-api' && github.ref == 'refs/heads/codex/request-plugin-usage-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Verify root module and response accounting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p web/dist
          touch web/dist/index.html
          go vet ./...
          go build ./...
          go test ./controller ./model ./pkg/jsplugin ./plugins ./relay/... ./service
      - name: Verify relaykit independently
        working-directory: relaykit
        run: |
          set -euo pipefail
          go build ./...
          go test ./dto ./relayconvert/...
  build:
    if: github.repository == 'cao258190/new-api' && github.ref == 'refs/heads/codex/request-plugin-usage-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prepare version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          mkdir -p "$RUNNER_TEMP/release"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_REF }}
          # Docker save does not retain registry attestations. This artifact
          # records its exact source, image config digest and file checksums.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/cao258190/new-api
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.title=NewAPI staging
            org.opencontainers.image.vendor=QuantumNous
          cache-from: type=gha,scope=staging-amd64
          cache-to: type=gha,mode=max,scope=staging-amd64

      - name: Smoke-test staging image
        run: |
          set -euo pipefail
          trap 'docker rm -f new-api-staging-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name new-api-staging-smoke \
            --tmpfs /data:rw,size=256m \
            -p 127.0.0.1:3002:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e CRYPTO_SECRET="$(openssl rand -hex 32)" \
            "$IMAGE_REF"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3002/api/status > "$RUNNER_TEMP/release/smoke-status.json" \
              && jq -e --arg version "$RELEASE_VERSION" '.success == true and .data.version == $version' \
                "$RUNNER_TEMP/release/smoke-status.json" >/dev/null; then
              curl -fsS http://127.0.0.1:3002/ | grep -qi '<html'
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 new-api-staging-smoke
          exit 1

      - name: Export immutable staging artifact
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          image_id=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/release/build-metadata.json"
          jq -n --arg version "$RELEASE_VERSION" --arg image "$IMAGE_REF" --arg id "$image_id" \
            --arg source "$(git rev-parse HEAD)" --arg upstream "$UPSTREAM_SHA" \
            --arg workflow_sha "$GITHUB_SHA" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version:$version,image_ref:$image,image_id:$id,source_sha:$source,upstream_sha:$upstream,workflow_sha:$workflow_sha,platform:"linux/amd64",run_url:$run_url,purpose:"isolated staging only",tests:{local:"root vet/build and affected plugin/model/relay/service tests passed; covers threshold accounting and missing upstream usage",frontend:"typecheck, changed-file lint/format, build and 334 usage-log tests passed; 16 processing-display tests rerun after formatting",linux_regression:"separate Verify response usage regression job; require overall run success",database_matrix:"not rerun: no schema, query or driver changes",image_smoke:"passed"},security_scanning:{enabled:false,policy:"existing isolated staging policy"}}' \
            > "$RUNNER_TEMP/release/release.json"
          docker save "$IMAGE_REF" | gzip -1 > "$RUNNER_TEMP/release/image.tar.gz"
          cd "$RUNNER_TEMP/release"
          sha256sum image.tar.gz release.json build-metadata.json smoke-status.json > SHA256SUMS

      - name: Upload staging image and build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: new-api-staging-amd64-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: new-api-staging-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: ignore
          retention-days: 7
