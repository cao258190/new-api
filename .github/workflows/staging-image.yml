name: Staging image artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-image-us-4-8
  cancel-in-progress: false

# Build only for the existing isolated test environment. The repository owner
# requested no repeated tests for this deployment; this source already passed
# the local backend, frontend and three-database checks in the current task.
# Production publishing remains a separate, protected registry workflow.
env:
  SOURCE_SHA: 05de6d4b468d4094972531f6cb4925f132f043bd
  UPSTREAM_SHA: ea343c4a81151bfd537d33b66527c25fa21a1112
  RELEASE_VERSION: custom-v2026.11.06.1-rc.1
  IMAGE_REF: new-api-staging:custom-v2026.11.06.1-rc.1

jobs:
  build:
    if: github.repository == 'cao258190/new-api' && github.ref == 'refs/heads/codex/subscription-redemption-codes'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prepare version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          mkdir -p "$RUNNER_TEMP/release"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_REF }}
          # Docker save does not retain registry attestations. This artifact
          # records its exact source, image config digest and file checksums.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/cao258190/new-api
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.title=NewAPI staging
            org.opencontainers.image.vendor=QuantumNous
          cache-from: type=gha,scope=staging-amd64
          cache-to: type=gha,mode=max,scope=staging-amd64

      - name: Export immutable staging artifact
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          image_id=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/release/build-metadata.json"
          jq -n --arg version "$RELEASE_VERSION" --arg image "$IMAGE_REF" --arg id "$image_id" \
            --arg source "$(git rev-parse HEAD)" --arg upstream "$UPSTREAM_SHA" \
            --arg workflow_sha "$GITHUB_SHA" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version:$version,image_ref:$image,image_id:$id,source_sha:$source,upstream_sha:$upstream,workflow_sha:$workflow_sha,platform:"linux/amd64",run_url:$run_url,purpose:"isolated staging only",tests:{rerun:false,reason:"explicit user request; prior task validation retained"},security_scanning:{enabled:false,policy:"existing isolated staging policy"}}' \
            > "$RUNNER_TEMP/release/release.json"
          docker save "$IMAGE_REF" | gzip -1 > "$RUNNER_TEMP/release/image.tar.gz"
          cd "$RUNNER_TEMP/release"
          sha256sum image.tar.gz release.json build-metadata.json > SHA256SUMS

      - name: Upload staging image and build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: new-api-staging-amd64-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: new-api-staging-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: ignore
          retention-days: 7
